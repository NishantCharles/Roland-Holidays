<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Redirecting | Roland Holidays</title>
    <link rel="icon" href="./assets/img/icon.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png">
    <!--
        Each month now has its own page (january.html … december.html) so it can
        carry its own title, description and canonical URL. This file stays as a
        redirect so older links of the form month-detail.html?month=march keep
        working. It is not indexed.
    -->
    <script>
        (function () {
            var MONTHS = ['january','february','march','april','may','june',
                          'july','august','september','october','november','december'];
            var key = (new URLSearchParams(window.location.search).get('month') || '').toLowerCase();
            var target = MONTHS.indexOf(key) !== -1 ? key + '.html' : 'index.html#monthGrid';
            window.location.replace(target);
        })();
    </script>
</head>

<body>
    <noscript>
        <p style="font-family: sans-serif; padding: 24px;">
            This page has moved. Choose a month from the
            <a href="index.html#monthGrid">Plan By Month</a> section.
        </p>
    </noscript>
</body>

</html>
