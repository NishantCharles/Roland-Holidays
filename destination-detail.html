<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Redirecting | Roland Holidays</title>
    <link rel="canonical" href="https://nishantcharles.github.io/Roland-Holidays/destinations.html">
    <link rel="icon" href="./assets/img/icon.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png">
    <!--
        Every destination now has its own page with its own itinerary builder,
        so this file is a router rather than a page.

        It used to render a generic guide from ?country= or ?state=, but only
        the title and breadcrumb changed — the body kept Rajasthan's photos and
        Indian itinerary spots whatever you asked for, and its lightbox pointed
        at img.magnific.com, including a signed URL that expired in June 2026.

        Old links are kept working by sending them to the right page.
    -->
    <script src="./assets/js/data/destinations.js"></script>
    <script src="./assets/js/india-states.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var slug = (params.get('country') || params.get('state') || '').toLowerCase();

            /* Names used by older links that differ from our slugs. */
            var ALIASES = {
                himachal: 'himachal-pradesh',
                andamans: 'andaman',
                'andaman-islands': 'andaman',
                uk: 'uk',
                usa: 'usa',
                bali: 'indonesia',
                dubai: 'jordan'
            };
            if (ALIASES[slug]) slug = ALIASES[slug];

            var target = 'destinations.html';

            if (slug) {
                var state = (typeof INDIA_STATES !== 'undefined')
                    ? INDIA_STATES.filter(function (s) { return s.slug === slug; })[0] : null;
                if (state) {
                    target = state.page;
                } else if (typeof ROLAND_DESTINATIONS !== 'undefined'
                           && ROLAND_DESTINATIONS[slug] && ROLAND_DESTINATIONS[slug].page) {
                    target = ROLAND_DESTINATIONS[slug].page;
                }
            }

            window.location.replace(target);
        })();
    </script>
</head>

<body>
    <noscript>
        <p style="font-family: sans-serif; padding: 24px;">
            This page has moved. Browse our
            <a href="destinations.html">destinations</a> to find the one you want.
        </p>
    </noscript>
</body>

</html>
